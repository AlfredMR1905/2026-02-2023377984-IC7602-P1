apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-api
  template:
    metadata:
      labels:
        app: dns-api
    spec:
      containers:
        - name: dns-api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.api.port | quote }}
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.supabaseSecretName }}
                  key: url
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.supabaseSecretName }}
                  key: key
            - name: DNS_UPSTREAM_HOST
              value: {{ .Values.api.upstreamHost | quote }}
            - name: DNS_UPSTREAM_PORT
              value: {{ .Values.api.upstreamPort | quote }}
            - name: DNS_UPSTREAM_TIMEOUT_MS
              value: {{ .Values.api.upstreamTimeoutMs | quote }}
        - name: https-proxy
          image: nginx:alpine
          ports:
            - name: https
              containerPort: {{ .Values.api.tlsPort }}
              protocol: TCP
          volumeMounts:
            - name: tls
              mountPath: /etc/dns-api-tls
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.api.tlsSecretName }}
        - name: nginx-config
          configMap:
            name: dns-api-nginx
