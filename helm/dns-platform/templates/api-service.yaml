apiVersion: v1
kind: Service
metadata:
  name: dns-api
spec:
  type: ClusterIP
  selector:
    app: dns-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
    - name: https
      port: {{ .Values.api.tlsPort }}
      targetPort: {{ .Values.api.tlsPort }}
      protocol: TCP
