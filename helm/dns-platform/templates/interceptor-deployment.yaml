apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-interceptor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-interceptor
  template:
    metadata:
      labels:
        app: dns-interceptor
    spec:
      containers:
        - name: dns-interceptor
          image: "{{ .Values.interceptor.image }}:{{ .Values.interceptor.tag }}"
          imagePullPolicy: {{ .Values.interceptor.pullPolicy }}
          ports:
            - name: dns
              containerPort: {{ .Values.interceptor.port }}
              protocol: UDP
          env:
            - name: DNS_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.interceptor.port }}"
            - name: DNS_API_BASE_URL
              value: "https://dns-api:{{ .Values.api.tlsPort }}"
            - name: DNS_API_CA_CERT
              value: /etc/dns-api-ca/tls.crt
          volumeMounts:
            - name: dns-api-ca
              mountPath: /etc/dns-api-ca
              readOnly: true
      volumes:
        - name: dns-api-ca
          secret:
            secretName: {{ .Values.api.tlsSecretName }}
            items:
              - key: tls.crt
                path: tls.crt
